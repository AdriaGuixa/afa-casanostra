backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "actualitat"
    label: "Actualitat / Blog"
    folder: "src/content/actualitat"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Títol", name: "title", widget: "string"}
      - {label: "Data", name: "date", widget: "datetime"}
      - {label: "Tipus (Circular o Resum)", name: "tipus", widget: "select", options: ["Circular enviada", "Resum de festa", "Notícia general"]}
      - {label: "Imatge principal", name: "image", widget: "image", required: false}
      - {label: "Contingut de l'article", name: "body", widget: "markdown"}

  - name: "agenda"
    label: "Agenda i Esdeveniments"
    folder: "src/content/agenda"
    create: true
    sortable_fields: ["date", "title", "tipus"]
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Títol de l'acte", name: "title", widget: "string"}
      - {label: "Data i hora de l'acte", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: "HH:mm"}
      - {label: "Tipus d'acte", name: "tipus", widget: "select", options: ["Festa", "Reunió / Assemblea", "Xerrada o Taller", "Altres"], default: "Festa"}
      - {label: "Lloc o Horari breu (Ex: Pati a les 16:30h)", name: "lloc", widget: "string", required: false}
      - {label: "Imatge o Cartell (Opcional)", name: "image", widget: "image", required: false}
      - {label: "Enllaç d'inscripció o pagament (Opcional)", name: "enllac_inscripcio", widget: "string", required: false, hint: "Posa l'enllaç al formulari si cal comprar tiquets o inscriure's prèviament."}
      - {label: "Text del botó d'inscripció", name: "text_boto", widget: "string", default: "Inscriu-t'hi ara", required: false}
      - {label: "Descripció breu (per a la portada)", name: "description", widget: "string", required: false}
      - {label: "Explicació i Detalls complets", name: "body", widget: "markdown", required: false}

  - name: "documents"
    label: "Documents i Actes"
    folder: "src/content/documents"
    create: true
    sortable_fields: ["date", "title", "tipus"]
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - {label: "Títol del document", name: "title", widget: "string"}
      - {label: "Data del document o assemblea", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: "Arxiu PDF", name: "file", widget: "file"}
      - {label: "Secció", name: "tipus", widget: "select", options: ["Estatuts i RRI", "Actes d'Assemblea", "Informació Econòmica", "Formularis", "Altres"], default: "Actes d'Assemblea"}
      - {label: "Descripció breu (opcional)", name: "description", widget: "string", required: false}

  - name: "configuracio"
    label: "Configuració Interna"
    files:
      - file: "src/data/settings.json"
        label: "Sistema de Validació de Socis"
        name: "settings"
        fields:
          - {label: "Enllaç CSV de Google Sheets (Llista de Socis Actius)", name: "socis_csv_url", widget: "string", required: false, hint: "Ves al teu Google Sheets d'inscrits > Fitxer > Comparteix > Publica a la web > Tria CSV i enganxa l'enllaç aquí."}
      - file: "src/data/festes_banner.json"
        label: "Bàner de Venda de Tiquets (Festes)"
        name: "festes_banner"
        fields:
          - {label: "Activar Bàner a la Web?", name: "actiu", widget: "boolean", default: false, hint: "Activa aquest interruptor només quan hi hagi una venda de tiquets o inscripció en marxa."}
          - {label: "Títol de l'avís", name: "titol", widget: "string", default: "Inscripcions Obertes"}
          - {label: "Descripció o instruccions", name: "text", widget: "text", default: "Ja podeu inscriure-us i adquirir els tiquets per a la propera festa o activitat."}
          - {label: "Text del botó", name: "boto_text", widget: "string", default: "Inscriu-t'hi ara"}
          - {label: "Enllaç del botó (Ex: /formularis/nom-del-formulari o /actualitat)", name: "boto_enllac", widget: "string", default: "", required: false, hint: "Posa-hi l'enllaç directe al formulari de pagament o a la notícia."}

  - name: "formularis"
    label: "Formularis Natius (amb Pagament)"
    folder: "src/content/formularis"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Títol de l'Activitat", name: "title", widget: "string"}
      - {label: "Breu Descripció", name: "description", widget: "text", required: false}
      - {label: "Actiu (Obert al públic)", name: "actiu", widget: "boolean", default: true}
      - label: "Preguntes / Camps del Formulari"
        name: "preguntes"
        widget: "list"
        fields:
          - {label: "Títol de la pregunta (Ex: Nom de l'alumne)", name: "titol_pregunta", widget: "string"}
          - {label: "Tipus de camp", name: "tipus", widget: "select", options: ["Text", "Correu electrònic", "Número (sense preu)", "Article amb Preu (Calcula el total)"]}
          - {label: "Preu General (No Socis)", name: "preu", widget: "number", value_type: "float", default: 0, required: false}
          - {label: "Preu per Socis (Opcional)", name: "preu_soci", widget: "number", value_type: "float", default: 0, required: false, hint: "Si deixes 0 o el mateix, no hi haurà descompte. Si baixes el preu, s'aplicarà només als socis verificats."}
          - {label: "Obligatori?", name: "obligatori", widget: "boolean", default: true}
      - {label: "Text de confirmació final", name: "text_exit", widget: "text", required: false, default: "Gràcies! Hem rebut la teva inscripció correctament."}
